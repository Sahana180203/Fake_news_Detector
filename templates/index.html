<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            resize: vertical;
            outline: none;
            transition: border 0.3s;
        }

        textarea:focus { border-color: #4a90e2; }

        button {
            width: 100%;
            padding: 14px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.3s;
        }

        button:hover { background: #357abd; }

        .result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }

        .real {
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #2e7d32;
        }

        .fake {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fake News Detector</h1>
        <p class="subtitle">Paste a news article or headline below to check if it is real or fake</p>

        <form action="/predict" method="POST">
            <textarea 
                name="news_text" 
                placeholder="Paste your news article or headline here..."
            >{{ news_text or '' }}</textarea>
            <button type="submit">Analyze News</button>
        </form>

        {% if prediction %}
            <div class="result {{ 'real' if prediction == 'REAL' else 'fake' }}">
                {% if prediction == 'REAL' %}
                    ✅ This news appears to be REAL
                {% elif prediction == 'FAKE' %}
                    ❌ This news appears to be FAKE
                {% else %}
                    ⚠️ {{ prediction }}
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
